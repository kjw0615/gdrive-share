function cancelled(){const error=Error('다운로드를 취소했습니다.');error.name='AbortError';return error}

$('cancel-download').onclick=()=>{if(zipController){zipController.abort();$('cancel-download').disabled=true;zipProgress('다운로드를 취소하는 중…',null)}};

function size(n){const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]}

 const id=path?path.split('/').at(-1):'',seq=++sequence;files=[];folderFiles=[];loadingRows();setLoading(true);$('status').textContent='자료를 불러오는 중…';$('search').disabled=true;$('refresh-files').disabled=true;

async function searchAll(){

 if(!query){setLoading(false);files=folderFiles;render();return}
