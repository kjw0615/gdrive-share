<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공유 자료실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#24334b;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:64px auto;padding:0 24px}.label{color:#3465d9;font-size:13px;font-weight:700;letter-spacing:2px}h1{font-size:38px;margin:8px 0}p{color:#64748b}header{margin-bottom:32px}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #20385c08}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:22px;flex-wrap:wrap}input{border:1px solid #cbd5e1;padding:12px 16px;border-radius:9px;font:inherit;width:280px;max-width:100%}button,a{color:#315fcd}button{border:0;background:#edf3ff;border-radius:7px;padding:8px 12px;cursor:pointer;font:inherit}a{text-decoration:none}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:16px 22px;border-top:1px solid #edf0f4}th{background:#fafbfd;color:#758399;font-size:13px}td:first-child{min-width:260px}td button{background:transparent;padding:0;text-align:left;color:#24334b}td button:hover{text-decoration:underline}.notice{padding:12px 18px;background:#fff6db;color:#7b5b0b;border-radius:10px;margin:20px 0}#status{padding:0 22px 20px;color:#64748b}footer{font-size:13px;color:#8491a5;margin-top:20px}@media(max-width:600px){main{margin-top:30px}h1{font-size:30px}.toolbar input{width:100%}th,td{padding:14px}}
</style>
<main><header><span class="label">SHARED LIBRARY</span><h1>공유 자료실</h1><p>필요한 자료를 찾고, 폴더를 둘러보고, 파일을 내려받으세요.</p></header><div id="notice" class="notice" hidden>예시 모드입니다. 실제 Google Drive 자료는 아직 연결되지 않았습니다.</div><section class="panel"><div class="toolbar"><nav id="crumbs" aria-label="폴더 경로"></nav><input id="search" placeholder="현재 폴더에서 파일명 검색" aria-label="파일명 검색"></div><div class="scroll"><table><thead><tr><th>파일 / 폴더명</th><th>수정일</th><th>크기</th><th>다운로드</th></tr></thead><tbody id="rows"></tbody></table></div><div id="status" role="status" aria-live="polite"></div></section><footer>공유 자료실 · 읽기 전용</footer></main>
<script>
let files=[], sequence=0;const $=id=>document.getElementById(id), folderType='application/vnd.google-apps.folder';
function button(text, action){const el=document.createElement('button');el.textContent=text;el.onclick=action;return el}
function render(){const list=files.filter(f=>f.name.toLocaleLowerCase().includes($('search').value.toLocaleLowerCase()));$('rows').replaceChildren();for(const f of list){const tr=document.createElement('tr');const name=document.createElement('td');const isFolder=f.mimeType===folderType;name.append(isFolder?button('📁  '+f.name,()=>navigate(f.path)):document.createTextNode('📄  '+f.name));tr.append(name);for(const text of [f.modifiedTime?f.modifiedTime.slice(0,10):'—',f.size?size(Number(f.size)):'—']){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');if(!isFolder){const a=document.createElement('a');a.textContent=f.capabilities?.canDownload===false?'다운로드 제한':'다운로드 ↓';if(f.capabilities?.canDownload!==false)a.href='/download?id='+encodeURIComponent(f.id)+'&path='+encodeURIComponent(f.path);td.append(a)}else td.textContent='—';tr.append(td);$('rows').append(tr)}$('status').textContent=list.length?`${list.length}개의 자료`:'표시할 자료가 없습니다.'}
function size(n){const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]}
async function load(path=''){const id=path?path.split('/').at(-1):'';const seq=++sequence;files=[];$('rows').replaceChildren();$('status').textContent='자료를 불러오는 중…';$('search').disabled=true;try{const r=await fetch('/api/files?folder='+encodeURIComponent(id||'')+'&path='+encodeURIComponent(path));const data=await r.json();if(seq!==sequence)return;if(!r.ok)throw Error(data.error);files=data.files;$('notice').hidden=!data.demo;$('search').value='';$('crumbs').replaceChildren();for(const [i,c] of data.breadcrumbs.entries()){if(i)$('crumbs').append(' / ');$('crumbs').append(button(c.name,()=>navigate(c.path)))}render()}catch(e){if(seq===sequence)$('status').textContent=e.message}finally{if(seq===sequence)$('search').disabled=false}}
function navigate(id){location.hash=encodeURIComponent(id)}window.addEventListener('hashchange',()=>load(decodeURIComponent(location.hash.slice(1))));$('search').oninput=render;load(decodeURIComponent(location.hash.slice(1)));
</script></html>
