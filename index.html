<style>

@media(min-width:1440px){header{padding-top:80px}.toolbar{padding:28px 32px}th,td{padding-left:32px;padding-right:32px}}
@media(max-width:1023px){th:nth-child(1){width:48%}th:nth-child(2){width:14%}th:nth-child(3){width:38%}.toolbar{gap:16px;padding:20px}th,td{padding:18px 20px}}
@media(max-width:767px){.topbar{min-height:64px}.top-caption{font-size:10px}.toolbar{align-items:stretch;flex-direction:column;gap:14px;padding:16px}.search-box{width:100%}input{font-size:16px}table,tbody{display:block;width:100%}thead{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:20px 16px;border-top:1px solid #ededed}tbody tr:first-child{border-top:0}td{display:block;border:0;padding:0;min-width:0}td:first-child{grid-column:1/-1}.file-name{gap:12px}.file-title{font-size:15px}.file-size{grid-column:1;align-self:center;padding-left:36px}.file-actions{grid-column:2}.actions{justify-content:flex-end}.action{min-height:44px;padding:10px 12px;font-size:13px}#status{padding:16px}.footer{padding-top:32px}.footer-inner{gap:8px;align-items:flex-start;flex-direction:column}.folder-hint{display:none}}
@media(max-width:359px){.top-caption{display:none}.file-size{padding-left:0}.file-actions{grid-column:1/-1}.actions{justify-content:flex-start}}

.brand-logo{display:block;width:clamp(145px,16vw,190px);height:auto}.footer-name{display:flex;align-items:center;gap:6px}.footer-symbol{width:32px;height:32px;object-fit:contain}.file-location{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}

.top-controls{display:flex;align-items:center;gap:16px}.selection-bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);font-size:13px}.select-all{display:flex;gap:8px;align-items:center;cursor:pointer}.selection-bar input[type=checkbox],.file-check{appearance:auto;accent-color:var(--green-deep);width:18px;height:18px;min-height:18px;padding:0;flex-shrink:0;cursor:pointer}.file-check{margin:0}.check-hit{display:flex;align-items:center;justify-content:center;min-width:28px;min-height:44px;flex-shrink:0}.file-name{gap:10px}#zip-status{flex-basis:100%;color:var(--muted)}#zip-status:empty{display:none}.top-controls .action{min-height:40px}.file-size{padding-left:0}
html[data-theme=dark]{color-scheme:dark;--ink:#ededed;--muted:#a3a3a3;--line:#383838;--soft:#252525}html[data-theme=dark] body,html[data-theme=dark] .panel{background:#1c1c1c}html[data-theme=dark] .topbar,html[data-theme=dark] .footer-inner,html[data-theme=dark] td,html[data-theme=dark] #status,html[data-theme=dark] tbody tr{border-color:var(--line)}html[data-theme=dark] tbody tr:hover{background:#242424}html[data-theme=dark] input:focus{background:#202020}html[data-theme=dark] .action{background:#252525;color:var(--ink);border-color:#454545}html[data-theme=dark] .action:hover{background:#333}html[data-theme=dark] .action-download{background:#203d30;border-color:#316d4f}html[data-theme=dark] .action-download:hover{background:var(--green);color:#171717}html[data-theme=dark] .action:disabled{background:#252525;color:#777;border-color:#383838}html[data-theme=dark] .brand-logo,html[data-theme=dark] .footer-symbol{filter:brightness(0) invert(1)}
@media(max-width:767px){.top-caption{display:none}.selection-bar{padding:14px 16px;gap:10px}.selection-bar .action{font-size:12px;padding:8px 10px}.file-size{padding-left:72px}.top-controls{gap:8px}.brand-logo{width:145px}}
@media(max-width:359px){.file-size{padding-left:0}.selection-bar{gap:8px}}
</style>
<main>
<div class="topbar"><a class="brand" href="/" aria-label="JW Studio 첫 화면"><img class="brand-logo" src="/jw-studio-logo.png" alt="JW Studio" width="2079" height="756"></a><div class="top-controls"><span class="top-caption">JW STUDIO LIBRARY</span><button id="theme-toggle" class="action" type="button" aria-label="다크모드 전환">다크모드</button></div></div>
<header><span class="label">YOUR FILES, IN ONE PLACE</span><h1>필요한 자료를 한곳에서.</h1><p>폴더를 둘러보고, 문서를 열고, 필요한 파일을 내려받으세요.</p></header>
<div id="notice" class="notice" hidden>예시 자료가 표시되고 있습니다.</div>
<section class="panel" aria-label="공유 파일 목록">
<div class="toolbar"><nav id="crumbs" aria-label="폴더 경로"></nav><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="하위 폴더까지 검색" aria-label="현재 및 하위 폴더에서 파일명 검색"></div></div>
<div class="selection-bar"><label class="select-all"><input id="select-all" type="checkbox"> 전체 선택</label><span id="selected-count" role="status">0개 선택</span><button id="clear-selection" class="action" type="button">선택 해제</button><button id="download-selected" class="action action-download" type="button" disabled>선택 다운로드</button><span id="zip-status" role="status" aria-live="polite"></span></div><div class="scroll"><table><thead><tr><th scope="col">파일 / 폴더명</th><th scope="col">크기</th><th scope="col">열기 / 다운로드</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="status" role="status" aria-live="polite"></div></section>
<footer class="footer"><div class="footer-inner"><span class="footer-name"><img class="footer-symbol" src="/jw-studio-symbol.png" alt="" width="1254" height="1254"> © <span id="year"></span> JW Studio</span><span>자료의 저작권은 각 권리자에게 있습니다.</span></div></footer>
</main>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const selected=new Map();let zipBusy=false;
let files=[], folderFiles=[], currentPath='', sequence=0, searchTimer, searchController;const $=id=>document.getElementById(id), folderType='application/vnd.google-apps.folder';
function button(text, action){const el=document.createElement('button');el.textContent=text;el.onclick=action;return el}
function fileType(f){
 const mime=f.mimeType||'', ext=f.name.split('.').pop().toLowerCase();
 if(mime===folderType)return ['폴더','#e6a623','folder'];
 if(mime==='application/vnd.google-apps.document')return ['DOC','#4285f4','doc'];
 if(mime==='application/vnd.google-apps.spreadsheet')return ['SHEET','#18a365','sheet'];
 if(mime==='application/vnd.google-apps.presentation')return ['SLIDE','#eba719','slide'];
 if(mime==='application/pdf'||ext==='pdf')return ['PDF','#df4545','doc'];
 if(['doc','docx','odt'].includes(ext))return ['WORD','#3672ce','doc'];
 if(['xls','xlsx','csv','ods'].includes(ext))return ['EXCEL','#209c65','sheet'];
 if(['ppt','pptx','odp'].includes(ext))return ['PPT','#df783c','slide'];
 if(mime.startsWith('image/')||['png','jpg','jpeg','gif','webp','svg'].includes(ext))return ['IMG','#9b62cc','image'];
 if(['zip','rar','7z','tar','gz'].includes(ext))return ['ZIP','#8b718e','zip'];
 if(mime.startsWith('video/'))return ['VIDEO','#a560bb','slide'];
 if(mime.startsWith('audio/'))return ['AUDIO','#df6894','doc'];
 return [ext.toUpperCase().slice(0,5)||'FILE','#7c8b9f','doc'];
}
function fileIcon(f){
 const [label,color,kind]=fileType(f), ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 40 48');svg.setAttribute('class','file-icon');svg.setAttribute('aria-hidden','true');
 function shape(tag,attrs){const el=document.createElementNS(ns,tag);for(const [key,value]of Object.entries(attrs))el.setAttribute(key,value);svg.append(el);return el}
 shape('path',{d:kind==='folder'?'M2 9h15l4 5h17v28H2z':'M5 2h20l10 10v34H5z',fill:color});
 if(kind!=='folder')shape('path',{d:'M25 2v10h10',fill:'#ffffff70'});
 const text=shape('text',{x:20,y:36,'text-anchor':'middle',fill:'white','font-size':label.length>4?7:9,'font-weight':700});text.textContent=label;
 return svg;
}
function actionLink(label,route,f){const a=document.createElement('a');a.className=route==='/download'?'action action-download':'action';a.textContent=label;a.href=route+'?id='+encodeURIComponent(f.id)+'&path='+encodeURIComponent(f.path);return a}
function render(){
 const list=files;$('rows').replaceChildren();
 for(const f of list){
  const tr=document.createElement('tr'),name=document.createElement('td'),isFolder=f.mimeType===folderType,wrap=document.createElement('div');wrap.className='file-name';const hit=document.createElement('label');hit.className='check-hit';const check=document.createElement('input');check.type='checkbox';check.className='file-check';check.checked=selected.has(f.path);check.disabled=f.mimeType!==folderType&&f.capabilities?.canDownload===false;check.setAttribute('aria-label',f.name+' 선택');check.onchange=()=>{if(check.checked)selected.set(f.path,f);else selected.delete(f.path);updateSelection()};hit.append(check);wrap.append(hit,fileIcon(f));
  const title=document.createElement('span');title.className='file-title';title.append(isFolder?button(f.name,()=>navigate(f.path)):document.createTextNode(f.name));if(f.location){const location=document.createElement('span');location.className='file-location';location.textContent=f.location;title.append(location)}wrap.append(title);name.append(wrap);tr.append(name);
  const sizeCell=document.createElement('td');sizeCell.className='file-size';sizeCell.textContent=f.size?size(Number(f.size)):'—';tr.append(sizeCell);
  const actions=document.createElement('td'),group=document.createElement('div');group.className='actions';actions.className='file-actions';
  if(f.mimeType!==folderType&&f.capabilities?.canDownload===false){const disabled=document.createElement('button');disabled.className='action';disabled.textContent='다운로드 제한';disabled.disabled=true;group.append(disabled)}
  else if(isFolder){const download=button('다운로드',()=>downloadZip([f]));download.className='action action-download';group.append(download)}
  else {const a=actionLink('다운로드','/download',f);if(f.downloadFormat)a.title=f.downloadFormat.toUpperCase()+' 파일로 다운로드';group.append(a)}
  if(!isFolder&&f.canOpen){const open=actionLink('바로열기','/open',f);open.target='_blank';open.rel='noopener';group.append(open)}
  actions.append(group);tr.append(actions);$('rows').append(tr);
 }
 updateSelection();
 $('status').textContent=list.length?`${list.length}개의 자료`:'표시할 자료가 없습니다.';
}
function updateSelection(){
 $('selected-count').textContent=selected.size+'개 선택';$('download-selected').disabled=zipBusy||!selected.size;
 const eligible=files.filter(f=>f.mimeType===folderType||f.capabilities?.canDownload!==false),checked=eligible.filter(f=>selected.has(f.path)).length;
 $('select-all').checked=eligible.length>0&&checked===eligible.length;$('select-all').indeterminate=checked>0&&checked<eligible.length;
}
$('select-all').onchange=()=>{for(const f of files){if(f.mimeType!==folderType&&f.capabilities?.canDownload===false)continue;if($('select-all').checked)selected.set(f.path,f);else selected.delete(f.path)}render()};
$('clear-selection').onclick=()=>{selected.clear();render()};
$('download-selected').onclick=()=>downloadZip([...selected.values()]);
function themeLabel(){const dark=document.documentElement.dataset.theme==='dark';$('theme-toggle').textContent=dark?'일반모드':'다크모드';$('theme-toggle').setAttribute('aria-label',dark?'일반모드로 전환':'다크모드로 전환');$('theme-toggle').setAttribute('aria-pressed',String(dark))}
$('theme-toggle').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('jw-theme',theme)}catch{}themeLabel()};themeLabel();
async function archiveRequest(route,body){const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok){const error=await response.json().catch(()=>({error:'다운로드에 실패했습니다.'}));throw Error(error.error)}return response}
async function downloadZip(items){
 if(zipBusy)return;if(!items.length)return;zipBusy=true;updateSelection();$('zip-status').textContent='폴더와 파일을 확인하는 중…';
 try{
  if(!window.fflate)throw Error('압축 도구를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.');
  let cursor=null,entries=[],filename;do{const response=await archiveRequest('/api/archive/manifest',cursor?{cursor}:{items:items.map(f=>({path:f.path}))});const data=await response.json();entries.push(...data.entries);filename=data.filename;cursor=data.cursor;$('zip-status').textContent=entries.length+'개 항목 확인 중…'}while(cursor);
  const archive=Object.create(null),used=new Set();let total=0,index=0;
  for(const entry of entries){
   let name=entry.name;let n=2;while(used.has(name)){const directory=name.endsWith('/');name=entry.name.replace(/\/$/,'')+' ('+(n++)+')'+(directory?'/':'')}used.add(name);
   if(entry.directory){archive[name]=new Uint8Array();continue}
   $('zip-status').textContent=`파일을 받는 중 ${++index} / ${entries.filter(e=>!e.directory).length}`;
   const response=await archiveRequest('/api/archive/file',{token:entry.token});const reader=response.body.getReader();const chunks=[];let length=0;
   while(true){const {done,value}=await reader.read();if(done)break;total+=value.length;length+=value.length;if(total>256*1024*1024){await reader.cancel();throw Error('브라우저 메모리를 위해 한번에 256MB까지 지원합니다. 나누어 선택해 주세요.')}chunks.push(value)}
   const bytes=new Uint8Array(length);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length}archive[name]=bytes;
  }
  $('zip-status').textContent='ZIP으로 압축하는 중…';
  const zip=await new Promise((resolve,reject)=>window.fflate.zip(archive,{level:6},(error,data)=>error?reject(error):resolve(data)));
  const url=URL.createObjectURL(new Blob([zip],{type:'application/zip'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('zip-status').textContent='ZIP 다운로드를 시작했습니다.';
 }catch(error){$('zip-status').textContent=error.message}finally{zipBusy=false;updateSelection()}
}
function size(n){const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]}
async function load(path=''){clearTimeout(searchTimer);searchController?.abort();currentPath=path;const id=path?path.split('/').at(-1):'';const seq=++sequence;files=[];$('rows').replaceChildren();$('status').textContent='자료를 불러오는 중…';$('search').disabled=true;try{const r=await fetch('/api/files?folder='+encodeURIComponent(id||'')+'&path='+encodeURIComponent(path));const data=await r.json();if(seq!==sequence)return;if(!r.ok)throw Error(data.error);files=data.files;folderFiles=data.files;currentPath=data.breadcrumbs.at(-1).path;$('notice').hidden=!data.demo;$('search').value='';$('crumbs').replaceChildren();for(const [i,c] of data.breadcrumbs.entries()){if(i)$('crumbs').append(' / ');$('crumbs').append(button(c.name,()=>navigate(c.path)))}render()}catch(e){if(seq===sequence)$('status').textContent=e.message}finally{if(seq===sequence)$('search').disabled=false}}
async function searchAll(){
 const query=$('search').value.trim();searchController?.abort();
 if(!query){files=folderFiles;render();return}
 const controller=new AbortController();searchController=controller;files=[];render();$('status').textContent='하위 폴더까지 검색 중…';
 let cursor=null;
 try{
  do{
   const response=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({query,path:currentPath,cursor})});
   const data=await response.json();if(controller.signal.aborted)return;if(!response.ok)throw Error(data.error);
   files.push(...data.files);render();cursor=data.cursor;if(cursor)$('status').textContent=`${files.length}개 발견 · 하위 폴더 검색 중…`;
  }while(cursor);
 }catch(error){if(error.name!=='AbortError'&&!controller.signal.aborted)$('status').textContent=error.message}
}
function navigate(id){location.hash=encodeURIComponent(id)}
window.addEventListener('hashchange',()=>load(decodeURIComponent(location.hash.slice(1))));
$('search').oninput=()=>{searchController?.abort();clearTimeout(searchTimer);if(!$('search').value.trim()){files=folderFiles;render();return}searchTimer=setTimeout(searchAll,350)};
load(decodeURIComponent(location.hash.slice(1)));
</script></html>
