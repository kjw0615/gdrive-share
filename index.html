<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공유 자료실</title>
<style>
:root{--green:#3ecf8e;--green-deep:#24b47e;--ink:#171717;--muted:#707070;--line:#dfdfdf;--soft:#fafafa}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Inter,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green-deep);outline-offset:3px}
main{width:min(100% - clamp(32px,6vw,96px),1200px);margin:0 auto;min-height:100svh;display:flex;flex-direction:column}.topbar{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ededed}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;letter-spacing:-.3px}.brand-mark{width:14px;height:20px;display:inline-block;background:var(--green);clip-path:polygon(50% 0,100% 0,65% 43%,100% 43%,0 100%,32% 54%,0 54%)}.top-caption{color:var(--muted);font-size:12px;letter-spacing:.08em}
header{padding:clamp(36px,6vw,72px) 0 clamp(28px,4vw,48px)}.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}h1{font-size:clamp(32px,4.3vw,56px);font-weight:500;line-height:1.15;letter-spacing:-.035em;margin:16px 0}header p{color:var(--muted);font-size:clamp(15px,1.6vw,18px);line-height:1.7;margin:0;max-width:600px;word-break:keep-all}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #00000004}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px;border-bottom:1px solid var(--line)}#crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}#crumbs button{background:transparent;border:0;border-radius:4px;padding:8px;color:var(--muted);font-size:14px;max-width:100%;overflow-wrap:anywhere;text-align:left}#crumbs button:hover{background:var(--soft);color:var(--ink)}#crumbs button:last-child{color:var(--ink);font-weight:500}.search-box{position:relative;width:min(320px,45%);flex-shrink:0}.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:10px 12px 10px 40px;color:var(--ink);font-size:14px}input::placeholder{color:var(--muted)}input:focus{background:#fff;border-color:var(--green-deep)}
table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:18px 24px}th{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft)}th:nth-child(1){width:56%}th:nth-child(2){width:14%}th:nth-child(3){width:30%}td{border-top:1px solid #ededed;vertical-align:middle}tbody tr:hover{background:#fcfcfc}.file-name{display:flex;align-items:center;gap:14px;min-width:0}.file-title{min-width:0;overflow-wrap:anywhere;word-break:break-word;font-size:14px;font-weight:500;line-height:1.6}.file-title button{border:0;background:transparent;color:var(--ink);padding:6px 0;text-align:left;overflow-wrap:anywhere;font:inherit}.file-title button:hover{text-decoration:underline;text-underline-offset:4px}.file-icon{width:30px;height:36px;flex-shrink:0}.file-size{font-size:13px;color:var(--muted);white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.action{display:inline-flex;align-items:center;justify-content:center;min-height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 12px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}.action:hover{background:var(--soft);border-color:#b2b2b2}.action-download{background:#f0fcf6;border-color:#b7e9d0}.action-download:hover{background:var(--green);border-color:var(--green-deep)}.action:disabled{color:#9a9a9a;background:#fafafa;border-color:#ededed}.folder-hint{color:var(--muted);font-size:12px}.notice{padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--muted);font-size:13px;margin-bottom:20px}#status{padding:18px 24px;border-top:1px solid #ededed;color:var(--muted);font-size:12px}.scroll{width:100%}.footer{margin-top:auto;padding:48px 0 24px}.footer-inner{border-top:1px solid #ededed;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;color:var(--muted);font-size:12px;flex-wrap:wrap}.footer-name{font-weight:500;color:var(--ink)}
@media(min-width:1440px){header{padding-top:80px}.toolbar{padding:28px 32px}th,td{padding-left:32px;padding-right:32px}}
@media(max-width:1023px){th:nth-child(1){width:48%}th:nth-child(2){width:14%}th:nth-child(3){width:38%}.toolbar{gap:16px;padding:20px}th,td{padding:18px 20px}}
@media(max-width:767px){.topbar{min-height:64px}.top-caption{font-size:10px}.toolbar{align-items:stretch;flex-direction:column;gap:14px;padding:16px}.search-box{width:100%}input{font-size:16px}table,tbody{display:block;width:100%}thead{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:20px 16px;border-top:1px solid #ededed}tbody tr:first-child{border-top:0}td{display:block;border:0;padding:0;min-width:0}td:first-child{grid-column:1/-1}.file-name{gap:12px}.file-title{font-size:15px}.file-size{grid-column:1;align-self:center;padding-left:42px}.file-actions{grid-column:2}.actions{justify-content:flex-end}.action{min-height:44px;padding:10px 12px;font-size:13px}#status{padding:16px}.footer{padding-top:32px}.footer-inner{gap:8px;align-items:flex-start;flex-direction:column}.folder-hint{display:none}}
@media(max-width:359px){.top-caption{display:none}.file-size{padding-left:0}.file-actions{grid-column:1/-1}.actions{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main>
<div class="topbar"><a class="brand" href="/" aria-label="자료실 첫 화면"><span class="brand-mark" aria-hidden="true"></span>공유 자료실</a><span class="top-caption">SHARED LIBRARY</span></div>
<header><span class="label">YOUR FILES, IN ONE PLACE</span><h1>필요한 자료를 한곳에서.</h1><p>폴더를 둘러보고, 문서를 열고, 필요한 파일을 내려받으세요.</p></header>
<div id="notice" class="notice" hidden>예시 자료가 표시되고 있습니다.</div>
<section class="panel" aria-label="공유 파일 목록">
<div class="toolbar"><nav id="crumbs" aria-label="폴더 경로"></nav><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="현재 폴더에서 검색" aria-label="현재 폴더에서 파일명 검색"></div></div>
<div class="scroll"><table><thead><tr><th scope="col">파일 / 폴더명</th><th scope="col">크기</th><th scope="col">열기 / 다운로드</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="status" role="status" aria-live="polite"></div></section>
<footer class="footer"><div class="footer-inner"><span class="footer-name">© <span id="year"></span> 공유 자료실</span><span>자료의 저작권은 각 권리자에게 있습니다.</span></div></footer>
</main>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
let files=[], sequence=0;const $=id=>document.getElementById(id), folderType='application/vnd.google-apps.folder';
function button(text, action){const el=document.createElement('button');el.textContent=text;el.onclick=action;return el}
function fileType(f){
 const mime=f.mimeType||'', ext=f.name.split('.').pop().toLowerCase();
 if(mime===folderType)return ['폴더','#e6a623','folder'];
 if(mime==='application/vnd.google-apps.document')return ['DOC','#4285f4','doc'];
 if(mime==='application/vnd.google-apps.spreadsheet')return ['SHEET','#18a365','sheet'];
 if(mime==='application/vnd.google-apps.presentation')return ['SLIDE','#eba719','slide'];
 if(mime==='application/pdf'||ext==='pdf')return ['PDF','#df4545','doc'];
 if(['doc','docx','odt'].includes(ext))return ['WORD','#3672ce','doc'];
 if(['xls','xlsx','csv','ods'].includes(ext))return ['EXCEL','#209c65','sheet'];
 if(['ppt','pptx','odp'].includes(ext))return ['PPT','#df783c','slide'];
 if(mime.startsWith('image/')||['png','jpg','jpeg','gif','webp','svg'].includes(ext))return ['IMG','#9b62cc','image'];
 if(['zip','rar','7z','tar','gz'].includes(ext))return ['ZIP','#8b718e','zip'];
 if(mime.startsWith('video/'))return ['VIDEO','#a560bb','slide'];
 if(mime.startsWith('audio/'))return ['AUDIO','#df6894','doc'];
 return [ext.toUpperCase().slice(0,5)||'FILE','#7c8b9f','doc'];
}
function fileIcon(f){
 const [label,color,kind]=fileType(f), ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 40 48');svg.setAttribute('class','file-icon');svg.setAttribute('aria-hidden','true');
 function shape(tag,attrs){const el=document.createElementNS(ns,tag);for(const [key,value]of Object.entries(attrs))el.setAttribute(key,value);svg.append(el);return el}
 shape('path',{d:kind==='folder'?'M2 9h15l4 5h17v28H2z':'M5 2h20l10 10v34H5z',fill:color});
 if(kind!=='folder')shape('path',{d:'M25 2v10h10',fill:'#ffffff70'});
 const text=shape('text',{x:20,y:36,'text-anchor':'middle',fill:'white','font-size':label.length>4?7:9,'font-weight':700});text.textContent=label;
 return svg;
}
function actionLink(label,route,f){const a=document.createElement('a');a.className=route==='/download'?'action action-download':'action';a.textContent=label;a.href=route+'?id='+encodeURIComponent(f.id)+'&path='+encodeURIComponent(f.path);return a}
function render(){
 const list=files.filter(f=>f.name.toLocaleLowerCase().includes($('search').value.toLocaleLowerCase()));$('rows').replaceChildren();
 for(const f of list){
  const tr=document.createElement('tr'),name=document.createElement('td'),isFolder=f.mimeType===folderType,wrap=document.createElement('div');wrap.className='file-name';wrap.append(fileIcon(f));
  const title=document.createElement('span');title.className='file-title';title.append(isFolder?button(f.name,()=>navigate(f.path)):document.createTextNode(f.name));wrap.append(title);name.append(wrap);tr.append(name);
  const sizeCell=document.createElement('td');sizeCell.className='file-size';sizeCell.textContent=f.size?size(Number(f.size)):'—';tr.append(sizeCell);
  const actions=document.createElement('td'),group=document.createElement('div');group.className='actions';actions.className='file-actions';
  if(!isFolder){
   if(f.canOpen){const open=actionLink('바로열기','/open',f);open.target='_blank';open.rel='noopener';group.append(open)}
   if(f.capabilities?.canDownload===false){const disabled=document.createElement('button');disabled.className='action';disabled.textContent='다운로드 제한';disabled.disabled=true;group.append(disabled)}
   else {const a=actionLink('다운로드','/download',f);if(f.downloadFormat)a.title=f.downloadFormat.toUpperCase()+' 파일로 다운로드';group.append(a)}
  }else {const hint=document.createElement('span');hint.className='folder-hint';hint.textContent='폴더';group.append(hint)}
  actions.append(group);tr.append(actions);$('rows').append(tr);
 }
 $('status').textContent=list.length?`${list.length}개의 자료`:'표시할 자료가 없습니다.';
}
function size(n){const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]}
async function load(path=''){const id=path?path.split('/').at(-1):'';const seq=++sequence;files=[];$('rows').replaceChildren();$('status').textContent='자료를 불러오는 중…';$('search').disabled=true;try{const r=await fetch('/api/files?folder='+encodeURIComponent(id||'')+'&path='+encodeURIComponent(path));const data=await r.json();if(seq!==sequence)return;if(!r.ok)throw Error(data.error);files=data.files;$('notice').hidden=!data.demo;$('search').value='';$('crumbs').replaceChildren();for(const [i,c] of data.breadcrumbs.entries()){if(i)$('crumbs').append(' / ');$('crumbs').append(button(c.name,()=>navigate(c.path)))}render()}catch(e){if(seq===sequence)$('status').textContent=e.message}finally{if(seq===sequence)$('search').disabled=false}}
function navigate(id){location.hash=encodeURIComponent(id)}window.addEventListener('hashchange',()=>load(decodeURIComponent(location.hash.slice(1))));$('search').oninput=render;load(decodeURIComponent(location.hash.slice(1)));
</script></html>
